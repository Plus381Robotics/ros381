# slamtec RPLIDAR S2

PROTO RPLidarS2 [
  field SFVec3f translation 0 0 0
  field SFRotation rotation 0 0 1 3.14159
  field SFString name "lidar"
]

{
  Transform {
    translation IS translation
    rotation IS rotation
    children [
      Lidar {
        translation 0.0 0.0 0.04
        name IS name
        horizontalResolution 3200
        numberOfLayers 1
		near 0.05
        minRange 0.1
        maxRange 30.0
        noise 0.000833
		resolution 0.0003125
        minFrequency 5
        maxFrequency 15
        defaultFrequency 10
        type "rotating"
      }
      Transform {
        translation 0.0 0.0 0.04
        children [
          Shape {
            appearance PBRAppearance {
                baseColor 0.2 0.2 0.2
                roughness 1
                metalness 0
            }
            geometry Cylinder {
                height 0.08
                radius 0.045
            }
          }
        ]
      }
    ]
  }
}